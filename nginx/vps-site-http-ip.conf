# Временный сайт по IP без HTTPS (порт 80 → Next.js на 127.0.0.1:3000).
# На сервере: скопировать в /etc/nginx/sites-available/house и включить symlink (см. DEPLOY-SERVER.md).
#
# Когда появится домен и сертификаты — замените на vps-site.conf из этого репозитория.

upstream nextjs_house {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 300M;

    location / {
        proxy_pass http://nextjs_house;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
