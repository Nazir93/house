# Прямая раздача загрузок CMS — не нагружает Node.js (Range для видео поддерживает nginx).
# Путь на VPS: /var/www/house/frontend/public/uploads/
# При другом HOUSE_ROOT подставьте свой путь в setup-nginx-house.sh.

location ~* ^/uploads/.+\.(pdf|doc|docx|xls|xlsx|zip|rar)$ {
    return 403;
}

location /uploads/ {
    alias /var/www/house/frontend/public/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header Accept-Ranges bytes;
    access_log off;
}
