# Rate limit для публичных POST/API (внутри server { })
location = /api/leads {
    limit_req zone=house_leads burst=5 nodelay;
    include /etc/nginx/snippets/house-proxy.conf;
}

location ^~ /api/auth/ {
    limit_req zone=house_auth burst=10 nodelay;
    include /etc/nginx/snippets/house-proxy.conf;
}

location = /api/reviews/submit {
    limit_req zone=house_reviews burst=5 nodelay;
    include /etc/nginx/snippets/house-proxy.conf;
}
