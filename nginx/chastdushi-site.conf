# chastdushi.ru (канон) + частьдуши.рф (зеркало → 301 на .ru)
# Next.js на 127.0.0.1:3000
# На VPS: /etc/nginx/sites-available/house-chastdushi

upstream house_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Тест / прокси со старого VPS (8080)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 300M;

    include /etc/nginx/snippets/house-uploads-static.conf;

    include /etc/nginx/snippets/house-rate-limit-locations.conf;

    location / {
        include /etc/nginx/snippets/house-proxy.conf;
    }
}

# HTTP: www → канон HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.chastdushi.ru;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://chastdushi.ru$request_uri;
    }
}

# HTTP: частьдуши.рф → канон HTTPS (.ru)
server {
    listen 80;
    listen [::]:80;
    server_name xn--80aim8afhxn7a.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://chastdushi.ru$request_uri;
    }
}

# HTTP: apex → HTTPS (тот же хост)
server {
    listen 80;
    listen [::]:80;
    server_name chastdushi.ru;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://chastdushi.ru$request_uri;
    }
}

# HTTPS: www → канон
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chastdushi.ru;

    ssl_certificate /etc/letsencrypt/live/chastdushi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chastdushi.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://chastdushi.ru$request_uri;
}

# HTTPS: частьдуши.рф → канон (один сайт в индексе — chastdushi.ru)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80aim8afhxn7a.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/chastdushi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chastdushi.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://chastdushi.ru$request_uri;
}

# HTTPS: основной сайт
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chastdushi.ru;

    client_max_body_size 300M;

    ssl_certificate /etc/letsencrypt/live/chastdushi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chastdushi.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    include /etc/nginx/snippets/house-uploads-static.conf;

    include /etc/nginx/snippets/house-rate-limit-locations.conf;

    location /_next/static/ {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /icons/ {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        include /etc/nginx/snippets/house-proxy.conf;
    }
}
