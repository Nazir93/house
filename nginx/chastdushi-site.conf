# chastdushi.ru + частьдуши.рф — Next.js на 127.0.0.1:3000
# На VPS: /etc/nginx/sites-available/house-chastdushi
# Рядом на том же сервере kemperlabs.ru — отдельный server_name, не пересекается.

upstream house_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Тест по IP, пока DNS не переключён или для проверки
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 300M;

    location / {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chastdushi.ru www.chastdushi.ru xn--80aim8afhxn7a.xn--p1ai;

    client_max_body_size 300M;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

