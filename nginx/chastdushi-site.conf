# chastdushi.ru + частьдуши.рф — Next.js на 127.0.0.1:3000
# На VPS: /etc/nginx/sites-available/house-chastdushi
# Рядом на том же сервере kemperlabs.ru — отдельный server_name, не пересекается.
#
# Канонический хост: chastdushi.ru (без www). www → 301/308 на apex.

upstream house_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Тест по IP, пока DNS не переключён или для проверки
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 300M;

    location / {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    server_name chastdushi.ru www.chastdushi.ru xn--80aim8afhxn7a.xn--p1ai;

    client_max_body_size 300M;

    # www → apex включим после полной миграции DNS (см. scripts/old-vps-redirect-to-new.sh)
    # if ($host = www.chastdushi.ru) {
    #     return 308 https://chastdushi.ru$request_uri;
    # }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chastdushi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chastdushi.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.chastdushi.ru) {
        return 301 https://www.chastdushi.ru$request_uri;
    }

    if ($host = xn--80aim8afhxn7a.xn--p1ai) {
        return 301 https://$host$request_uri;
    }

    if ($host = chastdushi.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name chastdushi.ru www.chastdushi.ru xn--80aim8afhxn7a.xn--p1ai;
    return 404;
}
