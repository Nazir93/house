# chastdushi.ru + частьдуши.рф — Next.js на 127.0.0.1:3000
# На VPS: /etc/nginx/sites-available/house-chastdushi

upstream house_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Тест / прокси со старого VPS (8080)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 300M;

    include /etc/nginx/snippets/house-proxy.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name chastdushi.ru www.chastdushi.ru xn--80aim8afhxn7a.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chastdushi.ru www.chastdushi.ru xn--80aim8afhxn7a.xn--p1ai;

    client_max_body_size 300M;

    ssl_certificate /etc/letsencrypt/live/chastdushi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chastdushi.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location /_next/static/ {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /icons/ {
        proxy_pass http://house_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        include /etc/nginx/snippets/house-proxy.conf;
    }
}
