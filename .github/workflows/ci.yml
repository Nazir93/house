name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: frontend

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXTAUTH_SECRET: ci-build-placeholder-secret-min-32-chars-x
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma validate & generate
        run: npx prisma validate --schema=prisma/schema.prisma && npx prisma generate --schema=prisma/schema.prisma

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Start production server
        run: |
          nohup npm run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "--- next start log ---"
          cat /tmp/next-start.log || true
          exit 1

      - name: E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/next-start.pid ]; then kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true; fi
          for pid in $(lsof -t -i:3000 2>/dev/null || true); do kill "$pid" 2>/dev/null || true; done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

      - name: Upload Next.js start log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-start-log
          path: /tmp/next-start.log
